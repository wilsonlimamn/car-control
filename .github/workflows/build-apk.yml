name: Build & Release Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Compute version metadata
        id: version
        shell: bash
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VER="${GITHUB_REF_NAME#v}"
          else
            APP_VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "has_release_keystore=${HAS_RELEASE_KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Build Capacitor web assets & check JS/CSS compatibility
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          bun run build:cap
          bun run check:compat

      - name: Generate Android project with Capacitor
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure landscape orientation, version, and launcher icons
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, shutil

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          # Ensure MainActivity locks to landscape and application gets largeHeap for 1GB RAM head units
          if "android:largeHeap" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '<application\n        android:largeHeap="true"',
                  1,
              )
          if "android:screenOrientation" not in manifest:
              manifest = manifest.replace(
                  "<activity",
                  '<activity\n            android:screenOrientation="sensorLandscape"',
                  1,
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle = f.read()

          ver_code = os.environ.get("VERSION_CODE", "1")
          ver_name = os.environ.get("APP_VERSION", "1.0.0")
          gradle = re.sub(r"versionCode\s+\d+", f"versionCode {ver_code}", gradle)
          gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "{ver_name}"', gradle)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle)

          # Copy PWA icon into Android mipmap launcher folders
          src_512 = "public/pwa-512x512.png"
          src_192 = "public/pwa-192x192.png"
          res_root = "android/app/src/main/res"
          for root, _, files in os.walk(res_root):
              if "mipmap-" in os.path.basename(root):
                  for target in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      dst = os.path.join(root, target)
                      if os.path.exists(dst):
                          src = src_512 if "xxxhdpi" in root or "xxhdpi" in root else src_192
                          if os.path.exists(src):
                              shutil.copyfile(src, dst)
          PY
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}

      - name: Restore or create persistent debug keystore (preserves IndexedDB on APK updates)
        if: steps.version.outputs.has_release_keystore != 'true'
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: car-control-debug-keystore-v1

      - name: Ensure debug keystore exists if cache miss
        if: steps.version.outputs.has_release_keystore != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Car Control,O=Auto em Dia,C=BR"
          fi

      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cd ..
          mkdir -p release-apk
          cp "android/${APK_SRC}" "release-apk/car-control-v${{ steps.version.outputs.app_version }}.apk"
          cp "android/${APK_SRC}" "release-apk/car-control-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-control-apk-v${{ steps.version.outputs.app_version }}
          path: release-apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Car Control v${{ steps.version.outputs.app_version }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-apk/car-control-v${{ steps.version.outputs.app_version }}.apk
            release-apk/car-control-latest.apk
