<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Car Control" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Car Control - Auto em Dia | Cockpit Automotivo</title>
    <meta name="description" content="Cockpit automotivo esportivo minimalista para controle de manutenção, autonomia e peças sem poluição visual." />
    <meta property="og:title" content="Car Control - Auto em Dia | Cockpit Automotivo" />
    <meta property="og:description" content="Cockpit automotivo esportivo minimalista para controle de manutenção, autonomia e peças sem poluição visual." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      @-webkit-keyframes bootBarSlide {
        0% { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
        100% { -webkit-transform: translateX(260%); transform: translateX(260%); }
      }
      @keyframes bootBarSlide {
        0% { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
        100% { -webkit-transform: translateX(260%); transform: translateX(260%); }
      }
      #boot-progress-bar {
        width: 40%;
        height: 100%;
        border-radius: 9999px;
        background: #f59e0b;
        -webkit-animation: bootBarSlide 1.35s ease-in-out infinite;
        animation: bootBarSlide 1.35s ease-in-out infinite;
      }
      .low-perf #boot-progress-bar {
        -webkit-animation: none !important;
        animation: none !important;
        width: 60%;
      }
    </style>
    <script>
      (function () {
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }
        if (typeof Object.fromEntries !== 'function') {
          Object.fromEntries = function (entries) {
            var obj = {};
            if (!entries) return obj;
            if (Array.isArray(entries)) {
              for (var idx = 0; idx < entries.length; idx++) {
                var pair = entries[idx];
                if (pair && pair.length >= 2) {
                  obj[pair[0]] = pair[1];
                }
              }
              return obj;
            }
            if (typeof entries[Symbol && Symbol.iterator] === 'function') {
              var iter = entries[Symbol.iterator]();
              var step;
              while (!(step = iter.next()).done) {
                if (step.value && step.value.length >= 2) {
                  obj[step.value[0]] = step.value[1];
                }
              }
            }
            return obj;
          };
        }
        if (typeof Blob !== 'undefined' && typeof Blob.prototype.arrayBuffer !== 'function' && typeof Promise === 'function') {
          Blob.prototype.arrayBuffer = function () {
            var blob = this;
            return new Promise(function (resolve, reject) {
              var reader = new FileReader();
              reader.onload = function () {
                resolve(reader.result);
              };
              reader.onerror = function () {
                reject(reader.error || new Error('Falha ao ler arquivo local'));
              };
              reader.readAsArrayBuffer(blob);
            });
          };
        }
        if (typeof window.fetch !== 'function' && typeof Promise === 'function') {
          window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var opts = init || {};
            var method = (opts.method || 'GET').toUpperCase();
            return new Promise(function (resolve, reject) {
              try {
                var xhr = new XMLHttpRequest();
                xhr.open(method, url, true);
                if (/\.wasm(?:\?.*)?$/i.test(url) || opts.responseType === 'arraybuffer') {
                  xhr.responseType = 'arraybuffer';
                }
                if (opts.headers) {
                  var hKeys = Object.keys(opts.headers);
                  for (var hi = 0; hi < hKeys.length; hi++) {
                    xhr.setRequestHeader(hKeys[hi], opts.headers[hKeys[hi]]);
                  }
                }
                xhr.onload = function () {
                  var status = xhr.status === 0 && xhr.response ? 200 : xhr.status;
                  var ok = status >= 200 && status < 300;
                  var rawResp = xhr.response;
                  var respText = xhr.responseType === 'arraybuffer' ? '' : (xhr.responseText || '');
                  resolve({
                    ok: ok,
                    status: status,
                    statusText: xhr.statusText || '',
                    url: url,
                    arrayBuffer: function () {
                      if (rawResp instanceof ArrayBuffer) {
                        return Promise.resolve(rawResp);
                      }
                      var str = respText;
                      var buf = new ArrayBuffer(str.length);
                      var view = new Uint8Array(buf);
                      for (var ci = 0; ci < str.length; ci++) {
                        view[ci] = str.charCodeAt(ci) & 255;
                      }
                      return Promise.resolve(buf);
                    },
                    text: function () {
                      return Promise.resolve(respText);
                    },
                    json: function () {
                      try {
                        return Promise.resolve(JSON.parse(respText));
                      } catch (parseErr) {
                        return Promise.reject(parseErr);
                      }
                    }
                  });
                };
                xhr.onerror = function () {
                  reject(new TypeError('Falha de rede ao buscar ' + url));
                };
                xhr.send(opts.body || null);
              } catch (xhrErr) {
                reject(xhrErr);
              }
            });
          };
        }

        try {
          var lpPref = localStorage.getItem('car_control_low_perf_pref_v1') || 'auto';
          var lpAutoRaw = localStorage.getItem('car_control_low_perf_auto_v1');
          var lpAuto = lpAutoRaw ? JSON.parse(lpAutoRaw) : null;
          if (lpPref === 'on' || (lpPref === 'auto' && lpAuto && lpAuto.lowPerf)) {
            document.documentElement.classList.add('low-perf');
          }
        } catch (e) {}

        var LS_EVENTS_KEY = 'car_control_boot_events_v1';
        var LS_STATE_KEY = 'car_control_boot_state_v1';
        var LS_ENGINE_KEY = 'car_control_sql_engine_v1';
        var MAX_EVENTS = 100;
        var now = Date.now();
        var sessionId = String(now) + '-' + Math.floor(Math.random() * 10000);

        var persistedEvents = [];
        var previousBootFailed = false;
        var previousBootState = null;

        try {
          var rawEv = localStorage.getItem(LS_EVENTS_KEY);
          if (rawEv) {
            var parsedEv = JSON.parse(rawEv);
            if (Array.isArray(parsedEv)) {
              persistedEvents = parsedEv.slice(-MAX_EVENTS);
            }
          }
          var rawSt = localStorage.getItem(LS_STATE_KEY);
          if (rawSt) {
            previousBootState = JSON.parse(rawSt);
            if (previousBootState && previousBootState.completed === false) {
              previousBootFailed = true;
            }
          }
          localStorage.setItem(
            LS_STATE_KEY,
            JSON.stringify({
              sessionId: sessionId,
              startedAtIso: new Date(now).toISOString(),
              completed: false,
              lastStep: 'HTML carregado'
            })
          );
        } catch (e) {}

        function saveEvents(evList) {
          try {
            localStorage.setItem(LS_EVENTS_KEY, JSON.stringify(evList.slice(-MAX_EVENTS)));
          } catch (e) {}
        }

        function saveState(patch) {
          try {
            var cur = {};
            var raw = localStorage.getItem(LS_STATE_KEY);
            if (raw) cur = JSON.parse(raw) || {};
            for (var k in patch) {
              if (Object.prototype.hasOwnProperty.call(patch, k)) {
                cur[k] = patch[k];
              }
            }
            localStorage.setItem(LS_STATE_KEY, JSON.stringify(cur));
          } catch (e) {}
        }

        var slowActionsTimer = null;
        var coreMountTimer = null;

        function scheduleBootTimers() {
          if (slowActionsTimer) {
            clearTimeout(slowActionsTimer);
            slowActionsTimer = null;
          }
          if (coreMountTimer) {
            clearTimeout(coreMountTimer);
            coreMountTimer = null;
          }

          slowActionsTimer = setTimeout(function () {
            if (!diag.done) {
              diag.showSlowActions();
            }
          }, 15000);

          coreMountTimer = setTimeout(function () {
            if (!diag.done && !diag.reactMounted) {
              diag.setFatalError(
                'O carregamento dos scripts principais ultrapassou 30 segundos neste WebView.'
              );
            }
          }, 30000);
        }

        var diag = {
          sessionId: sessionId,
          startTime: now,
          lastTime: now,
          done: false,
          reactMounted: false,
          asmMode: false,
          fatalError: null,
          currentLabel: 'Carregando…',
          previousBootFailed: previousBootFailed,
          previousBootState: previousBootState,
          previousEventsSnapshot: persistedEvents.slice(-MAX_EVENTS),
          steps: [],
          errors: [],
          listeners: [],
          recordStep: function (label) {
            var t = Date.now();
            var elapsed = t - diag.startTime;
            var delta = t - diag.lastTime;
            diag.currentLabel = label;
            diag.steps.push({
              label: label,
              elapsedMs: elapsed,
              deltaMs: delta
            });
            diag.lastTime = t;

            persistedEvents.push({
              sessionId: sessionId,
              type: 'step',
              label: label,
              tsIso: new Date(t).toISOString(),
              elapsedMs: elapsed,
              deltaMs: delta
            });
            if (persistedEvents.length > MAX_EVENTS) {
              persistedEvents = persistedEvents.slice(-MAX_EVENTS);
            }
            saveEvents(persistedEvents);
            saveState({ lastStep: label });

            var statusEl = document.getElementById('boot-status-text');
            if (statusEl) {
              statusEl.textContent = label;
            }
            for (var i = 0; i < diag.listeners.length; i++) {
              try {
                diag.listeners[i](label);
              } catch (err) {}
            }
          },
          recordWarning: function (msg) {
            if (!msg) return;
            var tagged = '[Aviso] ' + msg;
            if (diag.errors.indexOf(tagged) === -1) {
              diag.errors.push(tagged);
            }
            var t = Date.now();
            persistedEvents.push({
              sessionId: sessionId,
              type: 'warn',
              label: msg,
              tsIso: new Date(t).toISOString(),
              elapsedMs: t - diag.startTime,
              deltaMs: t - diag.lastTime
            });
            if (persistedEvents.length > MAX_EVENTS) {
              persistedEvents = persistedEvents.slice(-MAX_EVENTS);
            }
            saveEvents(persistedEvents);
          },
          recordError: function (msg) {
            if (!msg) return;
            if (diag.errors.indexOf(msg) === -1) {
              diag.errors.push(msg);
            }
            var t = Date.now();
            persistedEvents.push({
              sessionId: sessionId,
              type: 'error',
              label: msg,
              tsIso: new Date(t).toISOString(),
              elapsedMs: t - diag.startTime,
              deltaMs: t - diag.lastTime
            });
            if (persistedEvents.length > MAX_EVENTS) {
              persistedEvents = persistedEvents.slice(-MAX_EVENTS);
            }
            saveEvents(persistedEvents);
          },
          setAsmMode: function (enabled) {
            diag.asmMode = Boolean(enabled);
            var hintEl = document.getElementById('boot-slow-hint');
            if (hintEl) {
              hintEl.style.display = enabled ? 'block' : 'none';
            }
          },
          showSlowActions: function () {
            var actions = document.getElementById('boot-actions');
            if (actions) {
              actions.style.display = 'flex';
            }
          },
          setFatalError: function (msg) {
            diag.fatalError = msg;
            diag.recordError(msg);
            var splash = document.getElementById('app-boot-splash');
            var box = document.getElementById('boot-error-box');
            var actions = document.getElementById('boot-actions');
            var details = document.getElementById('boot-details-box');
            var progress = document.getElementById('boot-progress-wrap');
            if (splash) {
              splash.style.display = 'flex';
            }
            if (progress) {
              progress.style.display = 'none';
            }
            if (box) {
              box.style.display = 'block';
              box.textContent = msg;
            }
            if (actions) {
              actions.style.display = 'flex';
            }
            if (details && details.style.display === 'block') {
              details.textContent = buildDetailsText();
            }
          },
          hideSplash: function () {
            var splash = document.getElementById('app-boot-splash');
            if (splash) {
              splash.style.display = 'none';
            }
          },
          resetSplash: function (label) {
            diag.done = false;
            diag.fatalError = null;
            diag.startTime = Date.now();
            diag.lastTime = diag.startTime;
            var splash = document.getElementById('app-boot-splash');
            var box = document.getElementById('boot-error-box');
            var actions = document.getElementById('boot-actions');
            var details = document.getElementById('boot-details-box');
            var progress = document.getElementById('boot-progress-wrap');
            if (splash) {
              splash.style.display = 'flex';
            }
            if (progress) {
              progress.style.display = 'block';
            }
            if (box) {
              box.style.display = 'none';
              box.textContent = '';
            }
            if (actions) {
              actions.style.display = 'none';
            }
            if (details) {
              details.style.display = 'none';
            }
            diag.recordStep(label || 'Tentando novamente…');
            scheduleBootTimers();
          },
          markDone: function () {
            diag.done = true;
            if (slowActionsTimer) {
              clearTimeout(slowActionsTimer);
              slowActionsTimer = null;
            }
            if (coreMountTimer) {
              clearTimeout(coreMountTimer);
              coreMountTimer = null;
            }
            var t = Date.now();
            persistedEvents.push({
              sessionId: sessionId,
              type: 'done',
              label: 'Inicialização concluída',
              tsIso: new Date(t).toISOString(),
              elapsedMs: t - diag.startTime,
              deltaMs: t - diag.lastTime
            });
            if (persistedEvents.length > MAX_EVENTS) {
              persistedEvents = persistedEvents.slice(-MAX_EVENTS);
            }
            saveEvents(persistedEvents);
            saveState({
              completed: true,
              finishedAtIso: new Date(t).toISOString(),
              lastStep: 'Inicialização concluída'
            });
            diag.hideSplash();
          }
        };

        diag.recordStep('HTML carregado');
        window.__BOOT_DIAG__ = diag;

        function buildDetailsText() {
          var ua = (navigator && navigator.userAgent) || 'N/A';
          var chromeMatch = ua.match(/(?:Chrome|Chromium|CriOS)\/([\d.]+)/i);
          var chromeVer = chromeMatch ? 'Chromium ' + chromeMatch[1] : ua;
          var wasm = (typeof WebAssembly === 'object' && typeof WebAssembly.instantiate === 'function') ? 'Sim' : 'Não (asm.js)';
          var cachedEngine = '';
          try {
            cachedEngine = localStorage.getItem(LS_ENGINE_KEY) || '';
          } catch (e) {}
          var idb = (typeof indexedDB !== 'undefined' && indexedDB !== null) ? 'Disponível' : 'Indisponível (fallback localStorage)';
          var sw = (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) ? 'Disponível' : 'Indisponível';
          var memParts = [];
          if (navigator && typeof navigator.deviceMemory === 'number') {
            memParts.push('RAM aprox.: ' + navigator.deviceMemory + ' GB');
          }
          if (window.performance && performance.memory) {
            memParts.push('Heap JS: ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + ' / ' + Math.round(performance.memory.jsHeapSizeLimit / 1048576) + ' MB');
          }
          var lines = [
            'Navegador/WebView: ' + chromeVer,
            'User-Agent: ' + ua,
            'WebAssembly: ' + wasm + (cachedEngine ? ' (cache: ' + cachedEngine + ')' : ''),
            'IndexedDB: ' + idb,
            'Service Worker: ' + sw,
            'Memória: ' + (memParts.length ? memParts.join(' | ') : 'API não disponível'),
            '',
            'Etapas:'
          ];
          for (var i = 0; i < diag.steps.length; i++) {
            var s = diag.steps[i];
            lines.push('  - ' + s.label + ': ' + s.elapsedMs + ' ms (+' + s.deltaMs + ' ms)');
          }
          if (diag.errors.length > 0) {
            lines.push('', 'Avisos e erros capturados:');
            for (var j = 0; j < diag.errors.length; j++) {
              lines.push('  ! ' + diag.errors[j]);
            }
          }
          return lines.join('\n');
        }

        window.__SHOW_BOOT_DETAILS__ = function () {
          var details = document.getElementById('boot-details-box');
          if (!details) return;
          if (details.style.display === 'block') {
            details.style.display = 'none';
          } else {
            details.textContent = buildDetailsText();
            details.style.display = 'block';
          }
        };

        window.__BOOT_RETRY__ = function () {
          if (typeof window.__RETRY_APP_BOOT__ === 'function' && diag.reactMounted) {
            window.__RETRY_APP_BOOT__();
          } else {
            window.location.reload();
          }
        };

        window.addEventListener(
          'error',
          function (e) {
            var msg = (e && e.message) || '';
            var filename = (e && e.filename) || '';
            var lineno = (e && e.lineno) || 0;
            var colno = (e && e.colno) || 0;
            var target = e && e.target;

            // 1. Non-script resources (external fonts, images, stylesheets): tolerable
            if (target && target.tagName && target.tagName !== 'SCRIPT') {
              var resSrc = target.href || target.src || target.tagName;
              diag.recordWarning('Recurso não crítico (' + target.tagName + '): ' + resSrc);
              return;
            }

            // 2. Opaque "Script error." or empty filename/line from older WebView: tolerable, log explicitly
            var isOpaqueScriptError =
              msg === 'Script error.' ||
              msg === 'Script error' ||
              (!filename && lineno === 0 && !(target && target.tagName === 'SCRIPT'));
            if (isOpaqueScriptError) {
              diag.recordWarning(
                'Script error. (sem detalhes de arquivo/linha do WebView/cross-origin)' +
                  (filename ? ' [' + filename + ':' + lineno + ':' + colno + ']' : '')
              );
              return;
            }

            var loc = filename ? filename + ':' + lineno + (colno ? ':' + colno : '') : '';
            var errText =
              target && target.tagName === 'SCRIPT'
                ? 'Falha ao carregar script: ' + (target.src || 'módulo JS')
                : 'Erro JS (' + (loc || 'sem arquivo') + '): ' + (msg || 'Falha de script');

            // 3. Modern ESM / vite-legacy probe errors before legacy entry executes: tolerable
            var hasLegacyEntry = !!document.getElementById('vite-legacy-entry');
            var isLegacyFile =
              filename.indexOf('-legacy-') !== -1 || filename.indexOf('polyfills-legacy') !== -1;
            var targetSrc = (target && target.src) || '';
            var isLegacyTarget =
              targetSrc.indexOf('-legacy-') !== -1 || targetSrc.indexOf('polyfills-legacy') !== -1;
            var jsBooted = false;
            for (var k = 0; k < diag.steps.length; k++) {
              if (diag.steps[k].label === 'JS inicializado') {
                jsBooted = true;
                break;
              }
            }
            var isSameDoc =
              !filename || filename === window.location.href || filename.indexOf('data:') === 0;
            var isModernChunk = filename.indexOf('/assets/') !== -1 && !isLegacyFile;
            var isProbeSyntax =
              msg.indexOf('import.meta') !== -1 ||
              msg.indexOf('Unexpected token *') !== -1 ||
              msg.indexOf('Unexpected token function') !== -1;

            if (
              !jsBooted &&
              hasLegacyEntry &&
              !isLegacyFile &&
              !isLegacyTarget &&
              (isModernChunk || (isSameDoc && isProbeSyntax))
            ) {
              diag.recordWarning('Fallback legacy acionado: ' + errText);
              var statusEl = document.getElementById('boot-status-text');
              if (statusEl) {
                statusEl.textContent = 'Carregando modo compatível…';
              }
              return;
            }

            // 4. After React mounted, lazy chunk retries or recoverable script errors are logged as warnings;
            // fatal UI render crashes go to AppErrorBoundary and fatal DB failures go through App.tsx
            if (diag.reactMounted) {
              diag.recordWarning(errText);
              return;
            }

            // 5. Critical entry script or fatal pre-mount syntax error before React mounts
            diag.setFatalError(errText);
          },
          true
        );

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason && (e.reason.message || String(e.reason));
          diag.recordWarning('Rejeição assíncrona tolerada: ' + (reason || 'sem detalhes'));
        });

        scheduleBootTimers();
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-500/30" style="background-color:#080c15;color:#f8fafc;margin:0;">
    <div
      id="app-boot-splash"
      style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080c15;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:20px;padding-top:calc(20px + env(safe-area-inset-top, 0px));text-align:center;"
    >
      <div style="font-size:28px;font-weight:900;letter-spacing:0.06em;">CAR CONTROL</div>
      <div
        id="boot-progress-wrap"
        style="width:200px;max-width:70vw;height:4px;border-radius:9999px;background:rgba(255,255,255,0.14);overflow:hidden;margin-top:14px;"
      >
        <div id="boot-progress-bar"></div>
      </div>
      <div id="boot-status-text" style="font-size:17px;color:#cbd5e1;margin-top:12px;font-weight:600;">Carregando…</div>
      <div id="boot-slow-hint" style="display:none;font-size:14px;color:#fcd34d;margin-top:8px;font-weight:600;max-width:460px;">
        Primeira abertura pode levar até 1 minuto neste aparelho
      </div>
      <div
        id="boot-error-box"
        style="display:none;margin-top:16px;padding:12px 16px;border-radius:12px;background:#7f1d1d;color:#fecaca;font-size:15px;max-width:560px;word-break:break-word;border:1px solid #ef4444;"
      ></div>
      <div id="boot-actions" style="display:none;margin-top:16px;flex-wrap:wrap;justify-content:center;">
        <button
          type="button"
          onclick="window.__BOOT_RETRY__()"
          style="min-height:52px;padding:0 22px;margin:6px;border-radius:12px;background:#1d4ed8;color:#ffffff;font-size:16px;font-weight:800;border:none;"
        >
          Tentar novamente
        </button>
        <button
          type="button"
          onclick="window.__SHOW_BOOT_DETAILS__()"
          style="min-height:52px;padding:0 22px;margin:6px;border-radius:12px;background:#334155;color:#f8fafc;font-size:16px;font-weight:800;border:1px solid #64748b;"
        >
          Ver detalhes
        </button>
      </div>
      <pre
        id="boot-details-box"
        style="display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:#0f172a;color:#cbd5e1;font-size:13px;max-width:680px;width:100%;text-align:left;white-space:pre-wrap;word-break:break-word;border:1px solid #334155;max-height:40vh;overflow:auto;"
      ></pre>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
