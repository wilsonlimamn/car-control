<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Car Control" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Car Control - Auto em Dia | Cockpit Automotivo</title>
    <meta name="description" content="Cockpit automotivo esportivo minimalista para controle de manutenção, autonomia e peças sem poluição visual." />
    <meta property="og:title" content="Car Control - Auto em Dia | Cockpit Automotivo" />
    <meta property="og:description" content="Cockpit automotivo esportivo minimalista para controle de manutenção, autonomia e peças sem poluição visual." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script>
      (function () {
        function showBootError(msg) {
          var box = document.getElementById('boot-error-box');
          if (!box) return;
          box.style.display = 'block';
          box.textContent = msg;
        }
        window.addEventListener(
          'error',
          function (e) {
            var target = e && e.target;
            if (target && target.tagName === 'SCRIPT') {
              showBootError('Falha ao carregar script: ' + (target.src || 'index'));
              return;
            }
            showBootError('Erro ao iniciar: ' + ((e && e.message) || 'Falha de script'));
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason && (e.reason.message || String(e.reason));
          showBootError('Erro assíncrono: ' + (reason || 'Falha ao carregar'));
        });
        setTimeout(function () {
          if (!window.__CAR_CONTROL_BOOTED__) {
            showBootError(
              'O WebView desta central demorou para iniciar os módulos JS. Verifique se o Android System WebView está atualizado.'
            );
          }
        }, 7000);
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-500/30" style="background-color:#0b1120;color:#f8fafc;margin:0;">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1120;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="font-size:28px;font-weight:900;letter-spacing:0.05em;">CAR CONTROL</div>
        <div style="font-size:16px;color:#94a3b8;margin-top:10px;">Carregando painel do veículo...</div>
        <div id="boot-error-box" style="display:none;margin-top:16px;padding:12px 16px;border-radius:12px;background:#7f1d1d;color:#fecaca;font-size:14px;max-width:520px;word-break:break-word;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
